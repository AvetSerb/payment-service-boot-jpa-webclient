spring:
  datasource:
    url: jdbc:h2:mem:paydb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    # ВАЖНО: сначала Hibernate создаёт схему, потом выполнится data.sql
    defer-datasource-initialization: true
  sql:
    init:
      # гарантированно исполняем data.sql
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    org.hibernate.SQL: warn
    org.springframework.transaction: info
